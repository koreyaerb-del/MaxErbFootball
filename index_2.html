<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Max Erb QB Tracker</title>
<meta name="description" content="Private updates on Max Erb's Bethel University quarterback campaign.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --band:#3C2465; --band-2:#4A2372; --band-ink:#FFFFFF;
    --ground:#F4F0FA; --surface:#FFFFFF; --surface-2:#F1EBF7;
    --ink:#241A33; --muted:#6E6480; --line:#E4DCEF;
    --brand:#5A3392; --gold:#B8830F; --gold-bright:#E8B23A; --gold-soft:#F3E4BE;
    --good:#2E7D5B; --good-soft:#DFF0E7; --watch:#A9701A; --watch-soft:#F6E9D2;
    --shadow:0 1px 2px rgba(36,26,51,.06),0 10px 30px rgba(36,26,51,.08);
    --shadow-lg:0 24px 60px rgba(36,26,51,.16);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --band:#20132F; --band-2:#2C1A42; --band-ink:#F3EEF9;
      --ground:#100C17; --surface:#1C1526; --surface-2:#271D35;
      --ink:#ECE7F2; --muted:#A79DB8; --line:#332843;
      --brand:#B79BE0; --gold:#E0A94A; --gold-bright:#F0C264; --gold-soft:#3A2D18;
      --good:#5FC79B; --good-soft:#16301F; --watch:#E0A64A; --watch-soft:#33270F;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.4);
      --shadow-lg:0 26px 64px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
      --band:#20132F; --band-2:#2C1A42; --band-ink:#F3EEF9;
      --ground:#100C17; --surface:#1C1526; --surface-2:#271D35;
      --ink:#ECE7F2; --muted:#A79DB8; --line:#332843;
      --brand:#B79BE0; --gold:#E0A94A; --gold-bright:#F0C264; --gold-soft:#3A2D18;
      --good:#5FC79B; --good-soft:#16301F; --watch:#E0A64A; --watch-soft:#33270F;
      --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.4);
      --shadow-lg:0 26px 64px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}
  #app{display:none}
  .page{max-width:1120px; margin:0 auto; padding:20px 20px 64px}
  h1,h2,h3{margin:0}
  @media (prefers-reduced-motion:no-preference){
    #app{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
    .hero-photo img{animation:heroZoom 7s ease-out both}
  }
  @keyframes pageIn{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
  @keyframes heroZoom{from{transform:scale(1.07)} to{transform:scale(1)}}

  /* ---------- password gate ---------- */
  #gate{position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden;
    background:radial-gradient(120% 120% at 80% 0%, var(--band-2), var(--band) 70%)}
  #gate .gate-ghost{position:absolute; right:-4vw; bottom:-8vh; font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700;
    font-size:60vh; line-height:1; color:rgba(232,178,58,.08); pointer-events:none; user-select:none}
  .gate-card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-lg);
    width:100%; max-width:370px; padding:30px 28px; text-align:center}
  .gate-badge{width:66px; height:66px; border-radius:15px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(150deg,var(--band-2),var(--band)); color:var(--gold-bright);
    font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700; font-size:36px}
  .gate-card .eyebrow{color:var(--gold); justify-content:center}
  .gate-card h1{font-family:"Barlow Condensed",sans-serif; font-weight:700; font-size:30px; color:var(--ink); letter-spacing:.01em; margin-top:4px}
  .gate-card p{color:var(--muted); font-size:13px; margin:7px 0 18px}
  .gate-card input{width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px;
    background:var(--surface-2); color:var(--ink); font-size:15px; font-family:inherit}
  .gate-card input:focus{outline:2px solid var(--brand); outline-offset:1px}
  .gate-card button{width:100%; margin-top:10px; padding:12px; border:none; border-radius:10px; letter-spacing:.03em;
    background:var(--band-2); color:#fff; font-weight:600; font-size:15px; font-family:inherit; cursor:pointer; transition:background .15s}
  .gate-card button:hover{background:var(--band)}
  .gate-err{color:#D6483B; font-size:12.5px; margin-top:10px; min-height:16px}

  /* ---------- shared bits ---------- */
  .eyebrow{display:flex; align-items:center; gap:8px; font-family:"Barlow Condensed",sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:.16em; font-size:12px; color:var(--gold)}

  /* ---------- masthead ---------- */
  .masthead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:4px 4px 12px; border-bottom:2px solid var(--gold); margin-bottom:18px}
  .mh-brand{font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700; font-size:24px; letter-spacing:.02em; color:var(--ink)}
  .mh-brand span{color:var(--gold)}
  .mh-meta{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.12em; font-size:11.5px; color:var(--muted)}

  /* ---------- hero ---------- */
  .hero{position:relative; overflow:hidden; border-radius:20px; box-shadow:var(--shadow-lg);
    background:radial-gradient(130% 120% at 88% 6%, var(--band-2), var(--band) 68%); color:var(--band-ink)}
  .hero::after{content:""; position:absolute; left:-10%; top:0; width:44%; height:100%; pointer-events:none;
    background:linear-gradient(115deg, transparent 60%, rgba(232,178,58,.16) 61%, rgba(232,178,58,.16) 64%, transparent 65%)}
  .hero-ghost{position:absolute; right:-3vw; top:50%; transform:translateY(-50%); z-index:0;
    font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700; font-size:clamp(240px,36vw,460px); line-height:.8;
    color:rgba(232,178,58,.09); pointer-events:none; user-select:none}
  .hero-grid{position:relative; z-index:1; display:grid; grid-template-columns:1.12fr .88fr; gap:20px; align-items:center; padding:30px 32px}
  .hero-text .eyebrow{color:var(--gold-bright); opacity:.95}
  .nameplate{font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700; line-height:.86; margin:10px 0 6px;
    font-size:clamp(54px,8.5vw,104px); letter-spacing:.005em; text-wrap:balance}
  .nameplate .w{color:#fff}
  .nameplate .g{color:var(--gold-bright)}
  .hero-sub{font-family:"Barlow Condensed",sans-serif; font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:15px; opacity:.92}
  .hero-sub .hs-num{color:var(--gold-bright)}
  .hero-sub .dotsep{opacity:.5; margin:0 6px}
  .thesis{max-width:44ch; margin:14px 0 18px; font-size:15px; line-height:1.55; color:rgba(255,255,255,.9)}
  :root[data-theme="dark"] .thesis, :root:not([data-theme="light"]) .thesis{color:rgba(243,238,249,.86)}
  .pills{display:flex; flex-wrap:wrap; gap:8px}
  .pill{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:600;
    background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.2); color:var(--band-ink)}
  .pill .k{font-family:"Barlow Condensed",sans-serif; letter-spacing:.1em; text-transform:uppercase; font-size:10.5px; opacity:.7}
  .pill.good{background:rgba(120,220,170,.18); border-color:rgba(120,220,170,.42)}
  .pill.gold{background:rgba(232,178,58,.2); border-color:rgba(232,178,58,.5)}
  .pill .dot{width:7px; height:7px; border-radius:50%}
  .dot.g{background:#69d3a0} .dot.y{background:var(--gold-bright)}

  .hero-photo{display:flex; flex-direction:column; gap:8px}
  .photo-frame{position:relative; aspect-ratio:4/5; border-radius:14px; overflow:hidden;
    border:1px solid rgba(232,178,58,.55); box-shadow:0 18px 40px rgba(0,0,0,.34)}
  .photo-frame::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 55%, rgba(20,10,30,.35))}
  .photo-frame img{width:100%; height:100%; object-fit:cover; object-position:center 22%; display:block}
  .photo-cap{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:11px; color:rgba(255,255,255,.72); text-align:center}

  /* ---------- stat ticker ---------- */
  .ticker{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; margin-top:14px; overflow:hidden;
    background:var(--line); border:1px solid var(--line); border-radius:12px}
  .tk{background:var(--surface); padding:12px 14px; display:flex; flex-direction:column; gap:2px}
  .tk span{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.1em; font-size:10px; color:var(--gold)}
  .tk{font-weight:600; font-size:14px; color:var(--ink)}
  @media (max-width:760px){ .ticker{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:420px){ .ticker{grid-template-columns:repeat(2,1fr)} }

  /* ---------- outlook banner ---------- */
  .banner{position:relative; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--gold);
    border-radius:12px; padding:15px 18px; margin-top:16px; box-shadow:var(--shadow); font-size:13.5px}
  .banner b.bk{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.09em; color:var(--brand);
    font-size:13px; display:block; margin-bottom:5px}

  /* ---------- layout ---------- */
  .cols{display:grid; grid-template-columns:1.05fr .95fr; gap:16px; margin-top:16px}
  .stack{display:flex; flex-direction:column; gap:16px}
  @media (max-width:860px){ .cols{grid-template-columns:1fr} }
  @media (max-width:820px){
    .hero-grid{grid-template-columns:1fr; padding:24px 22px; gap:18px}
    .hero-photo{max-width:340px}
    .hero-ghost{font-size:300px; opacity:.6}
  }

  .card{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease}
  .card:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
  .card .body{padding:16px 18px}
  .sec{font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.11em;
    font-size:15px; color:var(--brand); display:flex; align-items:center; gap:11px; padding:13px 18px; border-bottom:1px solid var(--line)}
  .sec::before{content:""; width:15px; height:3px; border-radius:2px; background:var(--gold); flex:none}
  .sec::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line),transparent)}
  .lead{margin:0 0 11px; font-size:13.5px; color:var(--muted)}

  /* ---------- gameday ---------- */
  .gd-links{display:flex; flex-wrap:wrap; gap:10px; margin:2px 0 12px}
  .gd{flex:1 1 210px; display:flex; flex-direction:column; gap:2px; text-decoration:none; padding:12px 14px; border-radius:11px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-weight:600; font-size:14px; transition:transform .15s, border-color .15s}
  .gd:hover{transform:translateY(-2px); border-color:var(--gold)}
  .gd .gk{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.09em; font-size:10px; color:var(--gold)}
  .gd.watch{background:linear-gradient(150deg,var(--band-2),var(--band)); color:#fff; border-color:transparent}
  .gd.watch .gk{color:var(--gold-bright)}

  /* ---------- depth chart ---------- */
  .dc{display:flex; flex-direction:column; gap:8px}
  .dc-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:var(--surface-2); border:1px solid transparent}
  .dc-row .rk{font-family:"Barlow Condensed",sans-serif; font-style:italic; font-weight:700; font-size:22px; color:var(--muted); width:34px; text-align:center}
  .dc-row .nm{font-weight:600}
  .dc-row .nm .jn{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); font-weight:500; margin-left:5px}
  .dc-row .tag{margin-left:auto; font-size:11px; color:var(--muted); font-family:"Barlow Condensed",sans-serif; letter-spacing:.07em; text-transform:uppercase; text-align:right}
  .dc-row.me{background:linear-gradient(90deg,var(--gold-soft),transparent 130%); border-color:var(--gold)}
  .dc-row.me .rk{color:var(--gold)}
  .dc-row.me .nm{color:var(--ink)}
  .dc-note{margin-top:11px; font-size:12.5px; color:var(--muted)}
  .dc-note b{color:var(--ink)}

  /* ---------- lists / chips / quotes ---------- */
  ul.clean{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px}
  ul.clean li{position:relative; padding-left:20px; font-size:14px}
  ul.clean li::before{content:""; position:absolute; left:2px; top:8px; width:7px; height:7px; border-radius:2px; background:var(--gold); transform:rotate(45deg)}
  ul.clean li b{color:var(--ink)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-size:12.5px; font-weight:600; padding:8px 11px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line)}
  .chip .k{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:10px; color:var(--gold); display:block; margin-bottom:1px}
  .quote{margin:12px 0 0; padding:13px 15px; background:var(--surface-2); border-left:3px solid var(--gold); border-radius:0 10px 10px 0; font-size:13.5px; font-style:italic}
  .quote span{display:block; margin-top:6px; font-size:11.5px; color:var(--muted); font-style:normal}

  /* ---------- forecast ---------- */
  .fc{display:flex; flex-direction:column; gap:11px}
  .fc-item{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start}
  .badge{font-family:"Barlow Condensed",sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.06em; font-size:11px;
    padding:5px 9px; border-radius:6px; white-space:nowrap; margin-top:1px; min-width:78px; text-align:center}
  .badge.base{background:var(--good-soft); color:var(--good)}
  .badge.up{background:var(--gold-soft); color:var(--gold)}
  .badge.next{background:var(--surface-2); color:var(--brand)}
  .badge.watch{background:var(--watch-soft); color:var(--watch)}
  .fc-item p{margin:0; font-size:13.5px}

  /* ---------- game log ---------- */
  .logwrap{overflow-x:auto}
  table{border-collapse:collapse; width:100%; min-width:720px; font-size:13px}
  thead th{font-family:"Barlow Condensed",sans-serif; text-transform:uppercase; letter-spacing:.07em; font-size:12px; color:var(--muted);
    text-align:left; font-weight:600; padding:9px 10px; border-bottom:2px solid var(--line); white-space:nowrap}
  tbody td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:var(--surface-2)}
  .op{font-weight:600}
  .ha{font-family:"Barlow Condensed",sans-serif; font-weight:600; font-size:12px; padding:2px 7px; border-radius:5px; background:var(--surface-2); color:var(--muted); letter-spacing:.05em}
  .ha.h{background:var(--gold-soft); color:var(--gold)}
  td.dt{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); white-space:nowrap}
  td.stat{font-family:"IBM Plex Mono",monospace; color:var(--muted); font-variant-numeric:tabular-nums}
  tr.bye td{background:var(--surface-2); color:var(--muted); font-family:"Barlow Condensed",sans-serif; letter-spacing:.1em; text-transform:uppercase; font-size:11.5px; text-align:center}
  tr.bye:hover td{background:var(--surface-2)}
  .opener td{box-shadow:inset 3px 0 0 var(--gold)}

  .foot{margin-top:22px; display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between; align-items:baseline; font-size:11.5px; color:var(--muted)}
  .legend{display:flex; gap:14px; flex-wrap:wrap}
  .legend b{color:var(--ink); font-weight:600}

</style>
</head>

  function b64ToBytes(s){ var bin = atob(s); var out = new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }

  async function unlock(password){
    var enc = new TextEncoder();
    var baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64ToBytes(SALT), iterations:150000, hash:'SHA-256' },
      baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
    );
    var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBytes(IV) }, key, b64ToBytes(CT));
    return new TextDecoder().decode(plain);
  }

  var form = document.getElementById('gate-form');
  var err = document.getElementById('err');
  form.addEventListener('submit', async function(e){
    e.preventDefault();
    err.textContent = '';
    var pw = document.getElementById('pw').value;
    try {
      var html = await unlock(pw);
      document.getElementById('app').innerHTML = html;
      document.getElementById('app').style.display = 'block';
      var g = document.getElementById('gate'); g.parentNode.removeChild(g);
      document.body.classList.remove('locked');
      try { sessionStorage.setItem('maxpw', pw); } catch(_){}
    } catch(ex){
      err.textContent = 'Incorrect password. Please try again.';
      document.getElementById('pw').select();
    }
  });

  // Stay unlocked while the tab/session is open
  (function(){
    try {
      var saved = sessionStorage.getItem('maxpw');
      if(saved){ document.getElementById('pw').value = saved; form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit',{cancelable:true})); }
    } catch(_){}
  })();
</script>
